<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUKILARASU S // Fullscreen Interactive B&W Particle Matrix</title>
  
  <!-- Modern Font & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050811;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      cursor: crosshair;
    }

    /* Ambient Cyber Vignette */
    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 40%, rgba(5, 8, 17, 0.8) 90%, #050811 100%);
      z-index: 2;
    }

    /* Top Floating Executive HUD */
    .top-hud {
      position: absolute;
      top: 24px;
      left: 28px;
      right: 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }

    .brand-title h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #FFFFFF;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(14, 165, 233, 0.4);
    }

    .brand-title p {
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      color: #38BDF8;
      letter-spacing: 1.5px;
      margin-top: 2px;
    }

    .status-badge {
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      color: #10B981;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 6px 14px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #10B981;
      border-radius: 50%;
      box-shadow: 0 0 10px #10B981;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* Bottom Interactive Controls */
    .bottom-hud {
      position: absolute;
      bottom: 24px;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 10;
      pointer-events: none;
    }

    .instruction {
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      letter-spacing: 1px;
      color: #94A3B8;
      background: rgba(15, 23, 42, 0.7);
      padding: 6px 18px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
    }

    .instruction span {
      color: #38BDF8;
      font-weight: 600;
    }

    .control-pills {
      display: flex;
      gap: 10px;
      pointer-events: auto;
    }

    .pill-btn {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #F8FAFC;
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      padding: 7px 16px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.25s ease;
      backdrop-filter: blur(8px);
    }

    .pill-btn:hover {
      background: #0EA5E9;
      color: #FFFFFF;
      box-shadow: 0 0 15px rgba(14, 165, 233, 0.5);
      transform: translateY(-2px);
    }

    .pill-btn.active {
      background: #0EA5E9;
      color: #FFFFFF;
      border-color: #38BDF8;
    }

    /* Custom Tech Brackets */
    .hud-bracket-tl {
      position: absolute;
      top: 16px; left: 16px;
      width: 20px; height: 20px;
      border-top: 2px solid #0EA5E9;
      border-left: 2px solid #0EA5E9;
      pointer-events: none;
      z-index: 5;
    }
    .hud-bracket-br {
      position: absolute;
      bottom: 16px; right: 16px;
      width: 20px; height: 20px;
      border-bottom: 2px solid #0EA5E9;
      border-right: 2px solid #0EA5E9;
      pointer-events: none;
      z-index: 5;
    }
  </style>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Mukil's 37,600+ 3D Particle Dataset -->
  <script src="assets/mukil_particles_3d.js"></script>
</head>
<body>

  <div class="hud-bracket-tl"></div>
  <div class="hud-bracket-br"></div>
  <div class="vignette"></div>

  <!-- Header -->
  <div class="top-hud">
    <div class="brand-title">
      <h1>Mukilarasu S</h1>
      <p>// FULLSCREEN B&amp;W PARTICLE MATRIX &bull; 37,644 NODES</p>
    </div>
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>REAL-TIME PHYSICS 60 FPS</span>
    </div>
  </div>

  <!-- Three.js WebGL Canvas -->
  <canvas id="webgl-canvas"></canvas>

  <!-- Bottom Interactive HUD -->
  <div class="bottom-hud">
    <div class="instruction">
      &gt; <span>MOVE CURSOR OVER MUKIL</span> TO SCATTER PARTICLES &bull; <span>CLICK</span> TO EXPLODE
    </div>
    <div class="control-pills">
      <button class="pill-btn active" id="btn-repel">Force: Fluid Repel</button>
      <button class="pill-btn" id="btn-vortex">Force: Black Hole Vortex</button>
      <button class="pill-btn" id="btn-explode">⚡ Click to Explode</button>
      <button class="pill-btn" id="btn-reset">↺ Reset</button>
    </div>
  </div>

  <script>
    /* ==========================================================================
       THREE.JS HIGH-PERFORMANCE 3D PARTICLE ENGINE
       ========================================================================== */
    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050811, 0.35);

    // Camera setup (Aspect-aware centering)
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.z = 2.8;

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // Particle Texture: Soft glowing radial circle
    function createCircleTexture() {
      const size = 64;
      const cv = document.createElement('canvas');
      cv.width = size; cv.height = size;
      const c = cv.getContext('2d');
      const grad = c.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
      grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
      grad.addColorStop(0.3, 'rgba(240, 245, 255, 0.9)');
      grad.addColorStop(0.7, 'rgba(180, 210, 255, 0.3)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      c.fillStyle = grad;
      c.beginPath();
      c.arc(size/2, size/2, size/2, 0, Math.PI * 2);
      c.fill();
      return new THREE.CanvasTexture(cv);
    }

    const dotTexture = createCircleTexture();

    // Parse Data
    const rawData = window.MUKIL_PARTICLES || [];
    const count = Math.floor(rawData.length / 4);

    console.log(`Initialized with ${count.toLocaleString()} particles.`);

    // Buffers for Three.js
    const positions = new Float32Array(count * 3);
    const origins = new Float32Array(count * 3);
    const velocities = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);
    const baseBrightness = new Float32Array(count);

    for (let i = 0; i < count; i++) {
      const idx = i * 4;
      const x = rawData[idx];
      const y = rawData[idx + 1];
      const z = rawData[idx + 2];
      const br = rawData[idx + 3];

      // Origin coordinates
      origins[i * 3] = x;
      origins[i * 3 + 1] = y;
      origins[i * 3 + 2] = z;

      // Start position (with slight initial settling)
      positions[i * 3] = x;
      positions[i * 3 + 1] = y;
      positions[i * 3 + 2] = z;

      baseBrightness[i] = br;

      // Pure Black & White / Silver-White Shading
      // Contrast stretch
      const tone = Math.min(1.0, Math.max(0.12, Math.pow(br, 0.95) * 1.1));
      colors[i * 3] = tone;
      colors[i * 3 + 1] = tone;
      colors[i * 3 + 2] = tone;
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    // Material
    const material = new THREE.PointsMaterial({
      size: 0.024,
      vertexColors: true,
      map: dotTexture,
      transparent: true,
      opacity: 0.92,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    const particleSystem = new THREE.Points(geometry, material);
    scene.add(particleSystem);

    /* ==========================================================================
       PHYSICS & INTERACTIVE CURSOR ENGINE
       ========================================================================== */
    const mouse = {
      x: 0,
      y: 0,
      worldX: 9999,
      worldY: 9999,
      isHovered: false
    };

    let currentMode = 'repel'; // 'repel', 'vortex'
    const raycaster = new THREE.Raycaster();
    const planeZ = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);

    function onPointerMove(clientX, clientY) {
      mouse.x = (clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(clientY / window.innerHeight) * 2 + 1;
      mouse.isHovered = true;

      // Raycast onto Z=0 plane to get exact 3D world coordinates of the mouse!
      raycaster.setFromCamera(new THREE.Vector2(mouse.x, mouse.y), camera);
      const intersectPoint = new THREE.Vector3();
      raycaster.ray.intersectPlane(planeZ, intersectPoint);
      if (intersectPoint) {
        mouse.worldX = intersectPoint.x;
        mouse.worldY = intersectPoint.y;
      }
    }

    window.addEventListener('mousemove', (e) => onPointerMove(e.clientX, e.clientY));
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    window.addEventListener('mouseleave', () => {
      mouse.worldX = 9999;
      mouse.worldY = 9999;
      mouse.isHovered = false;
    });

    // Explode particles function
    function explodeParticles(force = 2.5) {
      for (let i = 0; i < count; i++) {
        const i3 = i * 3;
        const ang = Math.random() * Math.PI * 2;
        const pwr = (Math.random() * 0.08 + 0.02) * force;
        velocities[i3] += Math.cos(ang) * pwr;
        velocities[i3 + 1] += Math.sin(ang) * pwr;
        velocities[i3 + 2] += (Math.random() - 0.5) * pwr * 1.5;
      }
    }

    window.addEventListener('click', () => explodeParticles(1.8));

    // UI Buttons
    const btnRepel = document.getElementById('btn-repel');
    const btnVortex = document.getElementById('btn-vortex');
    const btnExplode = document.getElementById('btn-explode');
    const btnReset = document.getElementById('btn-reset');

    btnRepel.addEventListener('click', (e) => {
      e.stopPropagation();
      currentMode = 'repel';
      btnRepel.classList.add('active');
      btnVortex.classList.remove('active');
    });

    btnVortex.addEventListener('click', (e) => {
      e.stopPropagation();
      currentMode = 'vortex';
      btnVortex.classList.add('active');
      btnRepel.classList.remove('active');
    });

    btnExplode.addEventListener('click', (e) => {
      e.stopPropagation();
      explodeParticles(3.5);
    });

    btnReset.addEventListener('click', (e) => {
      e.stopPropagation();
      for (let i = 0; i < count; i++) {
        const i3 = i * 3;
        positions[i3] = origins[i3];
        positions[i3 + 1] = origins[i3 + 1];
        positions[i3 + 2] = origins[i3 + 2];
        velocities[i3] = 0;
        velocities[i3 + 1] = 0;
        velocities[i3 + 2] = 0;
      }
      geometry.attributes.position.needsUpdate = true;
    });

    // Window Resize Handler (Dynamic responsive scaling)
    function onWindowResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      
      // Auto-fit Mukil in fullscreen regardless of aspect ratio
      if (w < h) {
        // Mobile portrait mode
        camera.position.z = 3.6;
      } else {
        // Desktop landscape mode
        camera.position.z = 2.7;
      }
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
    window.addEventListener('resize', onWindowResize);
    onWindowResize();

    /* ==========================================================================
       ANIMATION LOOP (LOCKED 60 FPS)
       ========================================================================== */
    let clock = new THREE.Clock();
    const repelRadius = 0.38;
    const repelRadiusSq = repelRadius * repelRadius;

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      const mx = mouse.worldX;
      const my = mouse.worldY;

      const posAttr = geometry.attributes.position;
      const colAttr = geometry.attributes.color;

      // 3D Parallax camera tilt following cursor
      if (mouse.isHovered) {
        camera.position.x += (mouse.x * 0.35 - camera.position.x) * 0.05;
        camera.position.y += (mouse.y * 0.35 - camera.position.y) * 0.05;
        camera.lookAt(0, 0, 0);
      } else {
        camera.position.x += (0 - camera.position.x) * 0.03;
        camera.position.y += (0 - camera.position.y) * 0.03;
        camera.lookAt(0, 0, 0);
      }

      for (let i = 0; i < count; i++) {
        const i3 = i * 3;

        let px = positions[i3];
        let py = positions[i3 + 1];
        let pz = positions[i3 + 2];

        const ox = origins[i3];
        const oy = origins[i3 + 1];
        const oz = origins[i3 + 2];

        let vx = velocities[i3];
        let vy = velocities[i3 + 1];
        let vz = velocities[i3 + 2];

        // Vector to mouse
        const dx = mx - px;
        const dy = my - py;
        const distSq = dx * dx + dy * dy;

        // Interaction
        if (distSq < repelRadiusSq && distSq > 0.0001) {
          const dist = Math.sqrt(distSq);
          const force = (repelRadius - dist) / repelRadius;

          if (currentMode === 'repel') {
            // Fluid outward explosion away from cursor
            const angle = Math.atan2(dy, dx);
            vx -= Math.cos(angle) * force * 0.08;
            vy -= Math.sin(angle) * force * 0.08;
            vz += force * 0.09; // Blasts outward towards screen in 3D!
          } else {
            // Black Hole Vortex Swirl
            const angle = Math.atan2(dy, dx) + Math.PI / 2;
            vx += Math.cos(angle) * force * 0.06 - (dx / dist) * force * 0.02;
            vy += Math.sin(angle) * force * 0.06 - (dy / dist) * force * 0.02;
            vz += (Math.random() - 0.5) * 0.04;
          }

          // Dynamic brightness boost near cursor (Electric silver-white glow on hover!)
          colors[i3] = Math.min(1.0, colors[i3] + 0.15);
          colors[i3 + 1] = Math.min(1.0, colors[i3 + 1] + 0.18);
          colors[i3 + 2] = 1.0;
        } else {
          // Fade back to original Black & White tone
          const baseTone = Math.min(1.0, Math.max(0.12, Math.pow(baseBrightness[i], 0.95) * 1.1));
          colors[i3] += (baseTone - colors[i3]) * 0.08;
          colors[i3 + 1] += (baseTone - colors[i3 + 1]) * 0.08;
          colors[i3 + 2] += (baseTone - colors[i3 + 2]) * 0.08;
        }

        // Elastic Hooke's Spring return to original position
        const springX = ox - px;
        const springY = oy - py;
        const springZ = oz - pz;

        vx += springX * 0.075;
        vy += springY * 0.075;
        vz += springZ * 0.075;

        // Viscous fluid damping
        vx *= 0.88;
        vy *= 0.88;
        vz *= 0.88;

        positions[i3] = px + vx;
        positions[i3 + 1] = py + vy;
        positions[i3 + 2] = pz + vz;

        velocities[i3] = vx;
        velocities[i3 + 1] = vy;
        velocities[i3 + 2] = vz;
      }

      posAttr.needsUpdate = true;
      colAttr.needsUpdate = true;

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
